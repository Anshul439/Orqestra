name: parallel_backup
schedule: "0 2 * * *"
steps:
  - id: backup-db
    command: pg_dump "$DATABASE_URL" > /tmp/db.sql
    retries: 2

  - id: backup-redis
    command: redis-cli --rdb /tmp/redis.rdb
    retries: 2

  - id: compress
    command: tar -czf /tmp/backup-$(date +%Y%m%d).tar.gz /tmp/db.sql /tmp/redis.rdb
    depends_on: [backup-db, backup-redis]

  - id: upload
    command: aws s3 cp /tmp/backup-$(date +%Y%m%d).tar.gz s3://$S3_BUCKET/
    depends_on: [compress]
