syntax = "proto3";

package orchestrator;

option go_package = "github.com/Anshul439/Orqestra/proto";

message ReadySignal {}

message HeartbeatSignal {
  int32 job_id = 1;
}

message TaskResult {
  int32  job_id  = 1;
  bool   success = 2;
  string error   = 3;
  string output  = 4;
}

message WorkerMessage {
  string worker_id = 1;
  oneof payload {
    ReadySignal     ready     = 2;
    TaskResult      result    = 3;
    HeartbeatSignal heartbeat = 4;
  }
}

message TaskAssignment {
  int32  job_id      = 1;
  string type        = 2;
  string payload     = 3;
  int32  retry_count = 4;
  int32  max_retries = 5;
}

message ServerMessage {
  oneof payload {
    TaskAssignment task = 1;
  }
}

// Work is a bidirectional stream — worker sends ready/heartbeat/result, server sends job assignments.
service OrchestratorService {
  rpc Work (stream WorkerMessage) returns (stream ServerMessage);
}
